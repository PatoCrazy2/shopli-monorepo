<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sin conexión | ShopLI Admin</title>
  <link rel="icon" href="/shopli_snbg.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --card-bg: #fafafa;
      --btn-bg: #09090b;
      --btn-fg: #ffffff;
      --btn-hover: #27272a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --card-bg: #18181b;
        --btn-bg: #fafafa;
        --btn-fg: #09090b;
        --btn-hover: #e4e4e7;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 360px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      opacity: 0.45;
      filter: grayscale(100%);
    }
    .badge-offline {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-offline svg {
      width: 13px;
      height: 13px;
      stroke: var(--muted);
    }
    .text-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }
    p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      padding-top: 0.5rem;
    }
    .btn-retry {
      width: 100%;
      height: 42px;
      background-color: var(--btn-bg);
      color: var(--btn-fg);
      border: none;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.15s, transform 0.1s;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .btn-retry svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
    }
    .btn-home {
      width: 100%;
      height: 40px;
      background-color: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, color 0.15s;
    }
    .btn-home:hover {
      background-color: var(--card-bg);
      color: var(--fg);
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon-wrapper">
      <img src="/shopli_snbg.svg" alt="ShopLI" class="logo-img">
      <div class="badge-offline">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
    </div>

    <div class="text-group">
      <h1>Sin conexión</h1>
      <p>Comprueba tu red o intenta recargar para acceder a esta sección.</p>
    </div>

    <div class="actions">
      <button class="btn-retry" onclick="window.location.reload()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
          <path d="M16 21h5v-5"></path>
        </svg>
        Reintentar
      </button>
      <a href="/dashboard/inicio" class="btn-home">
        Ir al Inicio
      </a>
    </div>
  </main>
</body>
</html>
